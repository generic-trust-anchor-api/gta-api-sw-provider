name: CI
on:
  [workflow_dispatch, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pq-off-system
            meson_args: '--werror'
            run_valgrind: true
            need_swtpm: false
          - name: pq-off-wrap
            meson_args: -Dbuild-dependencies=true
            run_valgrind: false
            need_swtpm: false
          - name: pq-on-system
            meson_args: --werror -Denable-post-quantum-crypto=true
            run_valgrind: true
            need_swtpm: false
          - name: pq-on-system-with-tpm-backend
            meson_args: --werror -Denable-post-quantum-crypto=true -Denable-tpm2-backend=true -Dtcti-module='swtpm' -Dtcti-conf='host=127.0.0.1,port=2321'
            run_valgrind: true
            need_swtpm: true
    name: build-test (${{ matrix.name }})
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libcmocka-dev meson ninja-build build-essential libssl-dev libjitterentropy3-dev cmake pkg-config git valgrind
      - name: Download and run swtpm
        if: matrix.need_swtpm
        run: |
          sudo apt-get update && sudo apt-get install -y swtpm libtss2-dev tpm2-tools swtpm
          swtpm socket -d --tpmstate dir=/tmp --tpm2 --ctrl type=tcp,port=2322 --server type=tcp,port=2321 --flags not-need-init
          tpm2_startup -c
      - name: Checkout gta-api-core
        uses: actions/checkout@v4
        with:
          repository: 'generic-trust-anchor-api/gta-api-core'
          ref: 'main'
      - name: Build and install gta-api-core
        run: |
          meson setup build
          sudo ninja -C build install
      - name: Checkout gta-api-sw-provider
        uses: actions/checkout@v4
      - name: Build gta-api-sw-provider
        run: |
          meson setup build ${{ matrix.meson_args }}
          ninja -C build
      - name: Test gta-api-sw-provider
        run: |
          ninja -C build test
      - name: Valgrind
        if: matrix.run_valgrind
        run: |
          ninja -C build gta_provider_memcheck

  style-check:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout gta-api-sw-provider
        uses: actions/checkout@v4
      - name: Style check
        run: |
          FILES=$(find . -name '*.c' -o -name '*.h')
          clang-format --dry-run --Werror $FILES

  reuse-compliance-check:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout gta-api-sw-provider
        uses: actions/checkout@v4
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v6
        with:
          args: --include-submodules lint