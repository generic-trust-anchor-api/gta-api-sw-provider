name: CI
on:
  [workflow_dispatch, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libcmocka-dev meson ninja-build build-essential libssl-dev cmake pkg-config git valgrind libtss2-dev tpm2-tools
      - name: Download and verify TPM Simulator
        run: |
          wget -O ibmtpm1682.tar.gz https://sourceforge.net/projects/ibmswtpm2/files/ibmtpm1682.tar.gz/download
          echo "3cb642f871a17b23d50b046e5f95f449c2287415fc1e7aeb4bdbb8920dbcb38f  ibmtpm1682.tar.gz" | sha256sum -c -
      - name: Install TPM Simulator
        run: |
          mkdir tpm_simulator
          cd tpm_simulator
          tar -xf ../ibmtpm1682.tar.gz
          cd src
          make
          ./tpm_server &
          export TPM2TOOLS_TCTI="mssim:host=127.0.0.1,port=2321"
          tpm2_startup -c
      - name: Checkout liboqs
        uses: actions/checkout@v4
        with:
          repository: 'open-quantum-safe/liboqs'
          ref: '0.9.1'
      - name: Build and install liboqs
        run: |
          mkdir build
          cd build
          cmake -GNinja ..
          sudo ninja install
      - name: Checkout gta-api-core
        uses: actions/checkout@v4
        with:
          repository: 'generic-trust-anchor-api/gta-api-core'
          ref: 'main'
      - name: Build and install gta-api-core
        run: |
          meson setup build
          sudo ninja -C build install
      - name: Checkout gta-api-sw-provider
        uses: actions/checkout@v4
      - name: Build gta-api-sw-provider w/o PQC
        run: |
          meson setup build --werror
          ninja -C build
      - name: Test gta-api-sw-provider w/o PQC
        run: |
          ninja -C build test
      - name: Valgrind w/o PQC
        run: |
          ninja -C build gta_provider_memcheck
      - name: Build gta-api-sw-provider w/ PQC
        run: |
          meson setup build --reconfigure --werror -Denable-post-quantum-crypto=true
          ninja -C build
      - name: Test gta-api-sw-provider w/ PQC
        run: |
          ninja -C build test
      - name: Valgrind w/ PQC
        run: |
          ninja -C build gta_provider_memcheck
      - name: Build gta-api-sw-provider w/ TPM2
        run: |
          meson setup build --reconfigure --werror -Denable-tpm2-backend=true -Dtcti-module='mssim' -Dtcti-conf='host=127.0.0.1,port=2321'
          ninja -C build
      - name: Test gta-api-sw-provider w/ TPM2
        run: |
          ninja -C build test
#      - name: Valgrind w/ TPM2
#        run: |
#          ninja -C build gta_provider_memcheck

  style-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gta-api-sw-provider
        uses: actions/checkout@v4
      - name: Style check
        run: |
          FILES=$(find . -name '*.c' -o -name '*.h')
          clang-format --dry-run --Werror $FILES

  reuse-compliance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gta-api-sw-provider
        uses: actions/checkout@v4
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v6
        with:
          args: --include-submodules lint