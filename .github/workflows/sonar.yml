name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-26.04
    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory # Directory where build-wrapper output will be placed
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libcmocka-dev meson ninja-build build-essential libssl-dev libjitterentropy3-dev cmake pkg-config git gcovr lcov swtpm libtss2-dev
      - name: Start swtpm
        run: |
          swtpm socket -d --tpmstate dir=/tmp --tpm2 --ctrl type=tcp,port=2322 --server type=tcp,port=2321 --flags not-need-init,startup-clear
      - name: Checkout gta-api-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          repository: 'generic-trust-anchor-api/gta-api-core'
          ref: 'main'
      - name: Build and install gta-api-core
        run: |
          meson setup build
          sudo ninja -C build install
      - name: Checkout gta-api-sw-provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@22918119ff8e1ca75a623e15c8296b6ea4fbe28f #v8.2.1
      - name: Run Build Wrapper
        run: |
          meson setup build -Denable-post-quantum-crypto=true -Denable-tpm2-backend=true -Dtcti-module='swtpm' -Dtcti-conf='host=127.0.0.1,port=2321'
          build-wrapper-linux-x86-64 --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} ninja -C build
      - name: Create coverage report w/ TPM2
        run: |
          meson setup coverage_tpm -Denable-tpm2-backend=true -Dtcti-module='swtpm' -Dtcti-conf='host=127.0.0.1,port=2321' -Db_coverage=true
          ninja -C coverage_tpm test
          ninja -C coverage_tpm coverage-sonarqube
      - name: Create coverage report w/o TPM2
        run: |
          meson setup coverage -Db_coverage=true -Denable-post-quantum-crypto=true
          ninja -C coverage test
          ninja -C coverage coverage-sonarqube
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f #v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define sonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json
            --define sonar.coverageReportPaths=coverage_tpm/meson-logs/sonarqube.xml,coverage/meson-logs/sonarqube.xml
